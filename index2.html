:root{--bg:#F4F5F7;--card:#FFFFFF;--pri:#183D50;--pri-2:#24536B;--pri-t:#E8EEF1;--sav:#378663;--sav-t:#E9F3EE;--att:#D5A044;--att-d:#8F6618;--att-t:#FBF3E3;--warn:#C45B56;--warn-t:#F9EBEA;
 --ink:#14222B;--ink-2:#4A5862;--ink-3:#7A8791;--line:#E3E6EA;--line-2:#EEF0F3;--r:12px;--r-s:8px;--f:'SG',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
.num{white-space:nowrap}
.ic{display:block;flex-shrink:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- ramme ---------- */
html.phone body{background:var(--bg)}
html.framed body{background:#DDE1E6;display:flex;align-items:center;justify-content:center;min-height:100vh}
#app{height:100dvh}
html.framed #app{width:400px;height:min(860px,calc(100vh - 40px));border-radius:44px;border:11px solid #1B2730;overflow:hidden;background:var(--bg);box-shadow:0 30px 60px -20px rgba(20,34,43,.35);position:relative}
.shell{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.app{flex-direction:row}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
.side{display:none}

/* topbar */
.top{display:flex;align-items:center;gap:8px;height:58px;padding:0 10px 0 16px;background:var(--bg);flex-shrink:0;border-bottom:1px solid transparent}
.top .tt{font-size:17px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.top .tt.hide{visibility:hidden}
.top-r{display:flex;align-items:center;gap:2px;margin-left:auto}
.brandmark{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--pri);font-size:16px;letter-spacing:-.01em}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--ink);position:relative;flex-shrink:0}
.iconbtn:hover{background:rgba(24,61,80,.07)}
.iconbtn.sm{width:36px;height:36px;border:1px solid var(--line);background:var(--card)}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.top .iconbtn:first-child{margin-left:-8px}

/* bundnavigation */
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--ink-3);padding:6px 0;border-radius:10px}
.tabbar button.on{color:var(--pri)}
.tabbar button.on .ic{stroke-width:2.3}

/* hilsen */
.greet{padding:2px 0 2px}
.greet h1{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.greet p{color:var(--ink-3);font-size:14px;margin-top:2px}

/* segmented */
.segc{display:flex;background:#E7EAEE;border-radius:10px;padding:3px;gap:2px}
.segc button{flex:1;text-align:center;font-size:13.5px;font-weight:500;padding:8px 10px;border-radius:8px;color:var(--ink-2);white-space:nowrap}
.segc button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,34,43,.12)}
.segc.small button{padding:6px 10px;font-size:13px}

/* kort */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flush{padding:0;overflow:hidden}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cardh h2,.sh h2{font-size:16px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--ink-3);font-size:13px}
.body{color:var(--ink-2);font-size:14.5px}
.body+.body,.body+.link,.body+.fb{margin-top:10px}
.body.soft{color:var(--ink-3);font-size:13.5px;margin:-4px 0 12px}
.body.ok{color:var(--sav);display:flex;gap:6px;align-items:center;font-weight:500}
.body.warn-t{color:var(--warn);font-weight:500}
.fine{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:10px}
.fine.left{text-align:left}
.empty{color:var(--ink-3);font-size:14px;padding:6px 0}
.empty.big{padding:30px 0;text-align:center}
.link{color:var(--pri);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.more{margin-top:8px;color:var(--pri);font-weight:600;font-size:13.5px;padding:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;line-height:1.3}
.chip.plain{background:var(--line-2);color:var(--ink-2)}
.chip.amber{background:var(--att-t);color:var(--att-d)}
.chip.green{background:var(--sav-t);color:var(--sav)}
.chip.warn{background:var(--warn-t);color:var(--warn)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex-shrink:0}
.nm{display:flex;flex-direction:column;min-width:0;flex:1}
.nm b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--ink-3);font-size:12.5px;line-height:1.35}

/* logo-tiles */
.lg{width:var(--s);height:var(--s);border-radius:calc(var(--s)*.26);background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.lg svg{width:56%;height:56%}
.lg-n{background:color-mix(in srgb,var(--c) 13%,#fff);border-color:transparent;color:var(--c)}

/* knapper */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;font-weight:600;font-size:15.5px;text-align:center}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri-2)}
.btn.primary:disabled{background:#9AAAB4;cursor:default}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#C9CFD5}
.btn.danger{background:var(--card);border:1px solid #EBC9C7;color:var(--warn)}
.btn.wide{width:100%}
.fb{display:flex;flex-direction:column;gap:10px}

/* ---------- onboarding ---------- */
.shell.onb{background:var(--bg)}
.ob{height:100%;display:flex;flex-direction:column}
.ob-art{display:none}
.ob-body{flex:1;display:flex;flex-direction:column;min-height:0}
.ob-top{display:flex;align-items:center;gap:12px;padding:10px 10px 6px 16px;flex-shrink:0}
.ob-top .iconbtn:first-child{margin-left:-8px}
.steps{display:flex;gap:5px;flex:1;justify-content:center}
.steps i{width:22px;height:4px;border-radius:2px;background:#D6DBE0}
.steps i.on{background:var(--pri)}
.ob-main{flex:1;overflow-y:auto;padding:14px 22px 10px;display:flex;flex-direction:column;gap:18px}
.ob-main h1{font-size:28px;line-height:1.12;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.ob-main .lead{color:var(--ink-2);font-size:15.5px;margin-top:-6px}
.ob-cta{padding:12px 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;background:linear-gradient(to bottom,rgba(244,245,247,0),var(--bg) 14px);flex-shrink:0}
.ob-cta .btn{width:100%}
.feat{list-style:none;display:flex;flex-direction:column;gap:2px;margin-top:auto}
.feat li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.feat li>span{width:40px;height:40px;border-radius:10px;background:var(--pri-t);color:var(--pri);display:grid;place-items:center;flex-shrink:0}
.feat b{font-weight:600}
.feat small{display:block;color:var(--ink-3);font-size:13.5px}
/* velkomst – illustration på mobil */
.phone .ob.s1 .ob-art{display:block;background:var(--pri);color:#fff;margin:0 12px;border-radius:18px;padding:20px 18px 18px;order:0}
.phone .ob.s1 .ob-body{order:1}
.phone .ob.s1{padding-top:12px}
.phone .ob.s1 .ob-art h2,.phone .ob.s1 .ob-art p,.phone .ob.s1 .art-eyebrow{display:none}
.art-in h2{font-size:34px;line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:14px 0 14px;max-width:14ch}
.art-in p{color:#BFD0DA;font-size:16px;max-width:38ch}
.art-eyebrow{font-size:13.5px;color:#9DB6C4;font-weight:500}
.art-list{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.art-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:14px;color:#E4ECF1}
.art-row .lg{border-color:transparent}
.art-row:nth-child(2){margin-left:18px}.art-row:nth-child(3){margin-left:36px}
.phone .art-row:nth-child(2),.phone .art-row:nth-child(3){margin-left:0}
.phone .art-list{margin-top:0}
/* bank */
.acclist{display:flex;flex-direction:column;gap:8px}
.acc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.acc.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.accic{width:38px;height:38px;border-radius:10px;background:var(--pri-t);color:var(--pri);display:grid;place-items:center}
.tick{width:24px;height:24px;border-radius:7px;border:1.5px solid #C5CCD2;display:grid;place-items:center;color:#fff}
.acc.on .tick{background:var(--pri);border-color:var(--pri)}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--pri-t);border-radius:12px;padding:14px;color:var(--pri);margin-top:auto}
.note b{display:block;font-weight:600}
.note small{color:var(--ink-2);font-size:13px}
/* brugsdata */
.peek{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 16px}
.peek-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-bottom:10px}
.peek-r{display:flex;align-items:center;gap:12px;margin-top:6px}
.peek-r .nm small{white-space:normal}
.peek-v{text-align:right;display:flex;flex-direction:column}
.peek-v b{font-size:16px;font-weight:650}.peek-v small{font-size:11.5px;color:var(--ink-3)}
.peek-bar{height:6px;border-radius:3px;background:var(--line-2);margin:10px 0 12px 46px;overflow:hidden}
.peek-bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.peek-bar.am i{background:var(--att)}
.peek-bar:last-child{margin-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two-c{border-radius:12px;padding:12px 14px}
.two-c h3{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.two-c ul{list-style:none;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.two-c.yes{background:var(--sav-t)}.two-c.yes h3{color:var(--sav)}
.two-c.no{background:#EEF0F3}.two-c.no h3{color:var(--ink-2)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.choice.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #B8C0C7;flex-shrink:0;display:grid;place-items:center}
.choice.on .radio{border:6px solid var(--pri)}
.choice b{font-weight:600;display:block}.choice small{color:var(--ink-3);font-size:13px}
/* scanning */
.scanbar{height:4px;border-radius:2px;background:#DDE2E7;overflow:hidden}
.scanbar i{display:block;height:100%;background:var(--pri);transition:width .14s linear}
.scanlist{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;overflow:hidden}
.scanrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);animation:pop .3s ease-out}
.scanrow:last-child{border-bottom:0}
.scanrow .num{font-weight:600;font-size:14px}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- overblik ---------- */
.ov{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--pri);color:#fff;border-radius:16px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px}
.hero-k{font-size:14px;color:#AFC4D0;font-weight:500}
.hero-v{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:4px}
.hero-v span{font-size:20px;font-weight:600;letter-spacing:0;color:#CFDDE5}
.hero-s{color:#CFDDE5;font-size:15px;margin-top:4px}
.hero-r{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hero-m{flex:1;display:flex;flex-direction:column;gap:1px}
.hero-m b{font-size:20px;font-weight:650;white-space:nowrap}.hero-m span{font-size:13px;color:#AFC4D0}
.hero-m+.hero-m{border-left:1px solid rgba(255,255,255,.14);padding-left:14px}
.sav{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sav);border-radius:var(--r);padding:14px 14px 14px 14px;width:100%}
.sav-l{flex:1;display:flex;flex-direction:column}
.sav-k{display:flex;align-items:center;gap:6px;color:var(--sav);font-weight:600;font-size:13.5px}
.sav-v{font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--sav);line-height:1.15;margin:2px 0}
.sav-v small{font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.sav-s{font-size:12.5px;color:var(--ink-3)}
.sav-c{display:flex;align-items:center;gap:2px;color:var(--pri);font-weight:600;font-size:13.5px;white-space:nowrap}
.dn-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.donut{position:relative;flex-shrink:0}
.donut .seg{cursor:pointer;transition:opacity .15s}
.donut .seg.dim{opacity:.25}
.donut .seg:hover{opacity:.8}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-l{font-size:12px;color:var(--ink-3)}
.donut-v{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.donut-u{font-size:12px;color:var(--ink-3);margin-top:-2px}
.dn-list{width:100%}
.catlist{display:flex;flex-direction:column}
.catrow{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);font-size:14px;width:100%;border-radius:6px}
.catrow:first-child{border-top:0}
.catrow:hover{background:#F7F8FA}
.catrow.on{background:var(--pri-t)}
.catrow .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .cs{color:var(--ink-3);font-size:13px;text-align:right;min-width:36px}
.catrow .cm{font-weight:600;text-align:right;min-width:74px}
.catrow .cy{display:none;color:var(--ink-3);text-align:right;min-width:90px}
.attl{display:flex;flex-direction:column;gap:8px}
.att{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:#F7F8FA;width:100%;border-left:3px solid var(--line)}
.att.amber{border-left-color:var(--att)}.att.warn{border-left-color:var(--warn)}.att.plain{border-left-color:#9FB0BC}
.atic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--ink-2);flex-shrink:0;border:1px solid var(--line)}
.att.amber .atic{color:var(--att-d)}.att.warn .atic{color:var(--warn)}
.att .nm b{white-space:normal}
.atcta{display:flex;align-items:center;gap:2px;color:var(--pri);font-weight:600;font-size:13px;white-space:nowrap;align-self:center}
.upl{display:flex;flex-direction:column}
.uprow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line-2);width:100%;border-radius:6px}
.uprow:first-child{border-top:0}
.uprow:hover{background:#F7F8FA}
.uprow.paid{opacity:.55}
.udate{width:38px;display:flex;flex-direction:column;align-items:center;line-height:1.05;flex-shrink:0}
.udate b{font-size:18px;font-weight:650}.udate small{font-size:11.5px;color:var(--ink-3)}
.amt{font-weight:600;white-space:nowrap;text-align:right}
.amt small{font-weight:400;color:var(--ink-3);font-size:12px}
.amt.g,.g{color:var(--sav)}
.dsk-only{display:none}

/* ---------- betalinger ---------- */
.pay-top{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;color:var(--ink-3)}
.search input{flex:1;border:0;outline:0;font:inherit;color:var(--ink);background:transparent;min-width:0}
.search:focus-within{border-color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.fc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px;font-weight:500;padding:7px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.fc.on{background:var(--pri);border-color:var(--pri);color:#fff}
.fc em{font-style:normal;color:var(--ink-3);font-size:12px}
.fc.on em{color:#BFD0DA}
.sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.sort select{font:inherit;font-size:13.5px;color:var(--ink);font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
.pay{display:flex;flex-direction:column;gap:12px}
.sumline{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink-3);padding:2px 2px 8px}
.sumline b{color:var(--ink);font-weight:600}
.plist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phead{display:none}
.prow{display:grid;grid-template-columns:1fr auto;grid-template-areas:"main mo" "next st";column-gap:10px;row-gap:2px;padding:12px 14px;border-top:1px solid var(--line-2);width:100%;align-items:center}
.prow:first-of-type{border-top:0}
.prow:hover{background:#F9FAFB}
.c-main{grid-area:main;display:flex;align-items:center;gap:12px;min-width:0}
.c-mo{grid-area:mo;text-align:right;font-weight:650;display:flex;flex-direction:column;font-size:15px}
.c-mo small{font-size:11.5px;color:var(--ink-3);font-weight:400}
.c-next{grid-area:next;padding-left:52px;font-size:12.5px;color:var(--ink-3)}
.c-st{grid-area:st;justify-self:end}
.c-cat,.c-yr,.c-go{display:none}
/* kalender */
.cal{display:flex;flex-direction:column;gap:14px}
.cal-main,.cal-side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh h2{font-size:17px;font-weight:650;text-transform:capitalize}
.calsum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.calsum div{background:#F7F8FA;border-radius:10px;padding:10px 12px}
.calsum small{display:block;font-size:12px;color:var(--ink-3)}.calsum b{font-size:19px;font-weight:700}
.cwd,.cdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cwd span{text-align:center;font-size:11.5px;color:var(--ink-3);padding:4px 0}
.cd{min-height:58px;border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;border:1px solid transparent}
.cd.empty{pointer-events:none}
.cd .dn{font-weight:500;color:var(--ink-2)}
.cd.has{background:#F6F7F9}
.cd.today .dn{background:var(--pri);color:#fff;border-radius:10px;padding:0 6px}
.cd.sel{border-color:var(--pri);background:var(--pri-t)}
.dl{display:flex;flex-wrap:wrap;justify-content:center;gap:1px}
.dl .lg{border-radius:4px}
.dl em{font-style:normal;font-size:10px;color:var(--ink-3)}
.ds{font-size:10.5px;color:var(--ink-2);font-weight:600}
.bigp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.bigp h3{font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.bp{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.bp span{flex:1}.bp b{font-weight:600}

/* ---------- detalje ---------- */
.det{display:flex;flex-direction:column;gap:14px}
.det-main,.det-side{display:flex;flex-direction:column;gap:14px}
.dh{display:flex;align-items:center;gap:14px}
.dh h1{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:normal}
.dh .nm small{font-size:13.5px}
.dh-p{text-align:right;font-size:22px;font-weight:700;display:flex;flex-direction:column;letter-spacing:-.02em}
.dh-p small{font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.facts small,.kv small{display:block;font-size:12.5px;color:var(--ink-3)}
.facts b,.kv b{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.ubars{display:flex;align-items:flex-end;gap:8px;height:110px}
.ub{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.ub i{width:100%;max-width:34px;background:#C8D3DB;border-radius:4px 4px 0 0}
.ub i.cur{background:var(--pri)}
.ub small{font-size:11.5px;color:var(--ink-3)}
.plines{display:flex;flex-direction:column}
.pln{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px;width:100%}
.pln:first-child{border-top:0}
.pln.btnrow{grid-template-columns:auto 1fr auto auto}
.pln small{display:block;color:var(--ink-3);font-size:12px}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);width:100%;color:var(--pri)}
.act:hover{background:#F7F9FA}
.act span{display:flex;flex-direction:column;color:var(--ink)}
.act b{font-weight:600;font-size:14.5px}.act small{color:var(--ink-3);font-size:12.5px}
.tone-amber{border-left:4px solid var(--att)}
.tone-soft{background:#F7F8FA}
.tgl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);cursor:pointer}
.cardh+.tgl{border-top:0}
.tgl span{flex:1;display:flex;flex-direction:column}
.tgl b{font-weight:600;font-size:14.5px}.tgl small{color:var(--ink-3);font-size:12.5px}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl i{width:44px;height:26px;border-radius:13px;background:#CBD2D8;position:relative;flex-shrink:0;transition:background .15s}
.tgl i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl input:checked+i{background:var(--sav)}
.tgl input:checked+i::after{transform:translateX(18px)}
.tgl input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
.narrow{display:flex;flex-direction:column;gap:14px}
.ticks{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14.5px;color:var(--ink-2)}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks li .ic{margin-top:2px;color:var(--sav)}
.ticks.no li .ic{color:var(--ink-3)}
.ticks b{color:var(--ink)}
.timeline{display:flex;flex-direction:column;padding-left:4px}
.tl{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl:last-child{padding-bottom:0}
.tl::before{content:'';position:absolute;left:6px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;border:2px solid #B8C3CC;background:#fff;flex-shrink:0;margin-top:3px;z-index:1}
.tl.done i{background:#B8C3CC}
.tl.now i{border-color:var(--pri);background:var(--pri);box-shadow:0 0 0 4px var(--pri-t)}
.tl span{display:flex;flex-direction:column}.tl b{font-weight:600;font-size:14.5px}.tl small{color:var(--ink-3);font-size:13px}
.offer{background:var(--sav-t);border-radius:var(--r);padding:18px}
.offer-k{display:flex;align-items:center;gap:6px;color:var(--sav);font-weight:600;font-size:13.5px}
.offer-v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
.offer-c{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offer-c div{background:#fff;border-radius:10px;padding:10px}
.offer-c small{display:block;font-size:12px;color:var(--ink-3)}.offer-c b{font-size:16px;font-weight:650}
.offer-c .g b{color:var(--sav)}
.steps-l{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.steps-l li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.steps-l li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--pri-t);color:var(--pri);font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.steps-l li span{padding-top:3px}
.alt{display:flex;gap:12px;align-items:flex-start}
.alt .nm b{white-space:normal}
.alt-p{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.alt-p s{color:var(--ink-3);font-size:13px}.alt-p b{font-size:17px;font-weight:700}.alt-p em{font-style:normal;color:var(--sav);font-size:12.5px;font-weight:600;margin-bottom:4px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri div{border-radius:10px;padding:12px 10px}
.tri small{display:block;font-size:12.5px;font-weight:600}.tri b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.tri em{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.tri .t1{border:1.5px dashed #9CCBB2}.tri .t1 small{color:var(--sav)}
.tri .t2{background:var(--sav-t)}.tri .t2 small{color:var(--sav)}
.tri .t3{background:var(--sav);color:#fff}.tri .t3 em{color:#D3EBDD}
.how{display:flex;flex-direction:column;gap:12px}
.how div{display:flex;gap:12px;align-items:flex-start;color:var(--pri)}
.how span{display:flex;flex-direction:column;color:var(--ink)}.how b{font-weight:600}.how small{color:var(--ink-3);font-size:13px}
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 4px;max-width:480px;margin:0 auto;width:100%}
.ok-ic{width:72px;height:72px;border-radius:50%;background:var(--sav);color:#fff;display:grid;place-items:center}
.success h1{font-size:26px;font-weight:700;letter-spacing:-.025em}
.success .lead{color:var(--ink-2)}
.success .card{width:100%}.success .fb{width:100%}
.sc small{display:block;color:var(--ink-3);font-size:13px}.sc b{font-size:30px;font-weight:700;color:var(--sav);letter-spacing:-.02em}.sc em{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3)}

/* ---------- indsigter ---------- */
.ins{display:flex;flex-direction:column;gap:14px}
.basis{display:flex;gap:10px;align-items:flex-start;background:var(--pri-t);color:var(--pri);border-radius:10px;padding:12px 14px;font-size:13.5px}
.basis span{color:var(--ink-2)}
.sbars{display:flex;flex-direction:column;gap:12px}
.sbar{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "t t";gap:4px 10px;align-items:end}
.sl{grid-area:l;font-weight:600;font-size:14px;display:flex;flex-direction:column}.sl small{font-weight:400;color:var(--ink-3);font-size:12px}
.sbar b{grid-area:v;font-weight:700;font-size:16px}
.st{grid-area:t;height:14px;background:var(--line-2);border-radius:4px;overflow:hidden}
.st i{display:block;height:100%;border-radius:4px}
.st .pot{background:repeating-linear-gradient(135deg,#9CCBB2 0 5px,#E2F0E8 5px 10px)}
.st .pla{background:#8CC1A4}
.st .rea{background:var(--sav)}
.realised{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.rl{display:flex;align-items:center;gap:10px;padding:8px 0}
.rl .num{font-weight:650}
.ins-sav .link{margin-top:10px}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}
.delta.g{color:var(--sav)}.delta.w{color:var(--warn)}
.chart{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font-size:11px;font-family:var(--f)}
.chart .ln{fill:none;stroke:var(--pri);stroke-width:2.2;stroke-linejoin:round}
.chart .area{fill:var(--pri);opacity:.06}
.chart .pt{fill:#fff;stroke:var(--pri);stroke-width:2}
.chart .pt-l{fill:var(--pri)}
.chart .goal{stroke:var(--sav);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goal-t{fill:var(--sav);font-size:11px;font-weight:600;font-family:var(--f)}
.chart .evl{stroke:var(--line);stroke-dasharray:2 3}
.chart .evc{stroke:#fff;stroke-width:2}.chart .evc.g{fill:var(--sav)}.chart .evc.w{fill:var(--warn)}
.chart .hit{cursor:crosshair}.chart .hit:hover{fill:rgba(24,61,80,.05)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.lg-l{width:16px;height:2.5px;background:var(--pri);border-radius:2px}
.lg-g{width:16px;border-top:2px dashed var(--sav)}
.lg-e{width:10px;height:10px;border-radius:50%}.lg-e.g{background:var(--sav)}.lg-e.w{background:var(--warn)}
.stack{display:flex;height:16px;gap:2px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.stack i{display:block;min-width:3px}
.catlist.compact .catrow{padding:8px 4px}
.hbars{display:flex;flex-direction:column;gap:4px}
.hb{display:grid;grid-template-columns:24px 92px 1fr 66px;gap:10px;align-items:center;padding:6px 0;width:100%;font-size:13.5px}
.hn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{height:12px;background:transparent;border-radius:0 4px 4px 0;border-left:1px solid #C7CED4}
.ht i{display:block;height:100%;background:#5A7A8C;border-radius:0 4px 4px 0}
.ht i.hi{background:var(--att)}
.hb b{text-align:right;font-weight:600}
.nodata{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);font-size:13px;color:var(--ink-2)}
.nodata .ic{color:var(--ink-3);margin-top:1px}
.ovl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-2)}
.ovl:first-of-type{border-top:0}
.ovlogos{display:flex}
.ovlogos .lg+.lg{margin-left:-8px;box-shadow:0 0 0 2px #fff}
.ovl .nm b{white-space:normal}
.ovl>b{font-weight:650;text-align:right;white-space:nowrap;display:flex;flex-direction:column}
.ovl>b small{font-weight:400;font-size:11.5px;color:var(--ink-3)}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;color:var(--pri)}
.rec span{flex:1;display:flex;flex-direction:column;color:var(--ink)}.rec b{font-weight:600}.rec small{color:var(--ink-3);font-size:13px}
.rec:hover{background:#F7F9FA}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.gv{text-align:center}.gv b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block}.gv small{font-size:12.5px;color:var(--ink-3)}
.gbar{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden;margin-bottom:10px}
.gbar i{display:block;height:100%;background:var(--sav);border-radius:5px}
.gbar i.over{background:var(--warn)}

/* notifikationer & profil */
.nt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--line-2);width:100%}
.nt:first-child{border-top:0}
.nt:hover{background:#F9FAFB}
.ntic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--line-2);color:var(--ink-2)}
.nt.action .ntic{background:var(--att-t);color:var(--att-d)}.nt.price .ntic{background:var(--warn-t);color:var(--warn)}.nt.savings .ntic{background:var(--sav-t);color:var(--sav)}.nt.upcoming .ntic{background:var(--pri-t);color:var(--pri)}
.nt .nm b{white-space:normal}
.ntw{font-size:12px;color:var(--ink-3);white-space:nowrap}
.pf{display:flex;align-items:center;gap:14px}
.av{width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex-shrink:0}
.av.sm{width:32px;height:32px;font-size:14px}
.mrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line-2);width:100%;color:var(--pri)}
.mrow:first-child{border-top:0}
.mrow .nm{color:var(--ink)}
.mrow:hover{background:#F9FAFB}
.faq{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-top:1px solid var(--line-2);width:100%}
.faq:first-child{border-top:0}
.faq span{flex:1;display:flex;flex-direction:column;gap:6px}.faq b{font-weight:600}.faq small{color:var(--ink-2);font-size:14px}
.faq.open .ic{transform:rotate(180deg)}

/* tooltip, toast, tilstandsvælger */
.tip{position:fixed;left:0;top:0;z-index:50;background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;padding:6px 9px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;font-family:var(--f)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;z-index:40;animation:pop .2s ease-out;white-space:nowrap}
.toast .ic{color:#8CD3AE}
.modes{position:fixed;right:20px;bottom:20px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 6px 20px -8px rgba(20,34,43,.25)}
.modes .segc{background:transparent}
.gtip{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px;border-radius:10px;background:#F7F8FA;font-size:13.5px;color:var(--ink-2)}.gtip>span:not(.lg){flex:1}

/* Opsigelse – rød handling */
.act.opsig{background:var(--warn);border-color:var(--warn);color:#fff}
.act.opsig:hover{background:#B04E49;border-color:#B04E49}
.act.opsig span{flex:1;color:#fff}
.act.opsig b{color:#fff}
.act.opsig small{color:rgba(255,255,255,.82)}
.btn.red{background:var(--warn);color:#fff}
.btn.red:hover{background:#B04E49}
/* Vindue */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,34,43,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
html.framed .sheet-bg{position:absolute}
.sheet{background:var(--card);width:100%;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:#D3D9DE;margin:8px auto 0}
.sheet-h{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line-2)}
.sheet-h h2{font-size:18px;font-weight:700;letter-spacing:-.015em}
.sheet-b{overflow-y:auto;padding:16px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet-b h3{font-size:15px;font-weight:650}
.sheet-b .steps-l{margin-bottom:0}
.due{display:flex;gap:12px;align-items:center;background:var(--warn-t);border-radius:12px;padding:12px 14px}
.due-ic{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--warn);display:grid;place-items:center;flex-shrink:0}
.due span:last-child{display:flex;flex-direction:column}.due b{color:var(--warn);font-weight:650}.due small{font-size:13px;color:var(--ink-2)}
.sheet-note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);background:#F7F8FA;border-radius:10px;padding:11px 12px}
.sheet-note .ic{color:var(--ink-3);margin-top:2px}
.sheet-b .fine{margin-top:-6px}
.sheet-mark{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.sheet-mark span{display:flex;flex-direction:column}.sheet-mark b{font-weight:600}.sheet-mark small{font-size:13px;color:var(--ink-3)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.phone .ov-dn .cardh .muted{display:none}
.desk .hero-m{flex:none;min-width:120px}
.phone .ovl{flex-wrap:wrap}
.phone .ovl .nm{flex:1 1 160px}
.phone .ovl>b{width:100%;flex-direction:row;align-items:baseline;gap:8px;justify-content:flex-start;padding-left:2px}

/* ---------- besparelse pr. abonnement ---------- */
.pitem{border-top:1px solid var(--line-2)}
.pitem:first-of-type{border-top:0}
.pitem .prow{border-top:0}
.ostrip{display:flex;align-items:center;gap:10px;margin:0 14px 12px 66px;padding:9px 10px 9px 12px;border-radius:10px;background:var(--sav-t)}
.ostrip.k-opsigelse{background:var(--warn-t)}
.ostrip.done{background:#F2F4F6;color:var(--sav)}
.os-ic{color:var(--sav);display:grid;place-items:center}
.k-opsigelse .os-ic{color:var(--warn)}
.os-t{flex:1;display:flex;flex-direction:column;min-width:0}
.os-t b{font-size:14px;font-weight:650;color:var(--sav)}
.k-opsigelse .os-t b{color:var(--warn)}
.os-t small{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.os-btn{flex-shrink:0;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;white-space:nowrap}
.os-btn.primary{background:var(--pri);color:#fff}
.os-btn.red{background:var(--warn);color:#fff}
.ocard .okind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sav);margin-bottom:12px}
.ocard.k-opsigelse .okind{color:var(--warn)}
.orows{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.orows div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-top:1px solid var(--line-2);font-size:14px}
.orows div:first-child{border-top:0}
.orows small{color:var(--ink-3);font-size:13.5px}
.orows b{font-weight:600;text-align:right}
.osave{display:flex;flex-direction:column;margin:14px 0 4px;padding:12px 14px;border-radius:10px;background:var(--sav-t)}
.k-opsigelse .osave{background:var(--warn-t)}
.osave small{font-size:13px;color:var(--ink-2);font-weight:500}
.osave b{font-size:26px;font-weight:700;color:var(--sav);letter-spacing:-.02em;line-height:1.15}
.k-opsigelse .osave b{color:var(--warn)}
.osave span{font-size:13px;color:var(--ink-2)}
.ocard .body.soft0,.body.soft0{color:var(--ink-3);font-size:13.5px;margin:8px 0 12px}
.ocard.none .body.soft0{margin:0}
.ocard .btn{width:100%}
.btn.red{background:var(--warn);color:#fff}
.oname{display:flex;align-items:center;gap:10px}.oname b{font-weight:650;font-size:16px}
.sheet-b .orows,.sheet-b .osave{margin:0}
.phone .ostrip{margin:0 14px 12px;flex-wrap:wrap}
.phone .os-t{flex:1 1 170px}
.phone .os-btn{margin-left:auto}
.sheet-b>*{flex-shrink:0}
.exnote{font-size:12.5px;color:var(--ink-3);margin:-4px 2px 8px;display:flex;gap:6px;align-items:center}

/* forsidegraf */
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hc-top h2{font-size:16px;font-weight:650}
.hc-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.hper{flex:0 0 auto}
.phone .hper{width:100%}
.phone .hper button{padding:7px 4px;font-size:12.5px}
.hc-change{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
.hc-change.g{color:var(--sav)}.hc-change.w{color:var(--warn)}
.hc-read{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;font-size:13.5px;color:var(--ink-3)}
.hc-read span{text-transform:capitalize}
.hc-read b{font-size:20px;color:var(--ink);font-weight:700}
.hc-read em{font-style:normal;font-size:12px}
.chart .selg{stroke:var(--pri);stroke-width:1;stroke-dasharray:2 3;opacity:.5}
.chart .hit{cursor:pointer;outline:none}
.chart .hit:focus-visible{fill:rgba(24,61,80,.08)}
.chart .yr{font-weight:600;fill:var(--ink-2)}
/* ===================== Netbank (desktop) ===================== */
html.desk body{background:var(--bg)}
html.desk #app{height:100vh}
.desk .app{display:grid;grid-template-columns:252px 1fr}
.desk .side{display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);padding:22px 14px 18px;height:100vh}
.side-b{display:flex;flex-direction:column;gap:2px;padding:0 10px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}
.side-b .bank{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:var(--pri);letter-spacing:-.01em}
.side-b .mod{font-size:13px;color:var(--ink-3);padding-left:28px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;font-weight:500;color:var(--ink-2);font-size:14.5px}
.side nav button:hover{background:#F4F6F8}
.side nav button.on{background:var(--pri-t);color:var(--pri);font-weight:600}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 10px}
.side-f button{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:6px 0}
.side-f small{font-size:12px;color:var(--ink-3)}
.desk .tabbar{display:none}
.desk .top{height:68px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--card)}
.desk .top .tt{font-size:20px;font-weight:650}
.desk .top .iconbtn:first-child{margin-left:-10px}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-left:10px;padding-left:16px;border-left:1px solid var(--line)}
.desk .page{padding:26px 32px 60px;max-width:1280px;margin:0 auto;width:100%;gap:20px}
.desk .greet h1{font-size:30px}
.desk .card{padding:20px 22px}

/* overblik som dashboard */
.desk .ov{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.desk .switch{grid-column:1/-1;max-width:560px}
.desk .ov-hero{grid-column:1/-1}
.desk .ov-dn{grid-column:1/span 7}.desk .ov-up{grid-column:8/-1}
.desk .ov-hist{grid-column:1/-1}
.desk .ov>div>.card,.desk .ov-hero .hero{height:100%}
.desk .hero{flex-direction:row;align-items:flex-end;padding:26px 28px}
.desk .hero-l{flex:1}
.desk .hero-v{font-size:56px}
.desk .hero-r{flex-direction:row;gap:40px;border-top:0;padding-top:0;gap:12px;border-left:1px solid rgba(255,255,255,.14);padding-left:24px}
.desk .hero-m+.hero-m{border-left:0;padding-left:0}
.desk .sav{flex-direction:column;align-items:flex-start;padding:22px;justify-content:space-between}
.desk .sav-v{font-size:40px}
.desk .sav-c{margin-top:12px}
.desk .dn-wrap{flex-direction:row;align-items:center;gap:28px}
.desk .catrow .cy{display:block}
.desk .dsk-only{display:block}

/* betalinger */
.desk .pay-top{flex-direction:row;justify-content:space-between;align-items:center}
.desk .pay-top .segc:first-child{max-width:560px;flex:1}
.desk .pay{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.desk .pay-f{position:sticky;top:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.desk .pay-f .chips{flex-direction:column;margin:0;padding:0;gap:2px}
.desk .pay-f .fc{border:0;background:transparent;padding:8px 10px;width:100%}
.desk .pay-f .fc:hover{background:#F4F6F8}
.desk .pay-f .fc.on{background:var(--pri-t);color:var(--pri);font-weight:600}
.desk .pay-f .sort{flex-direction:column;align-items:stretch;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.desk .pay-f .filters{gap:12px}
.desk .phead,.desk .prow{grid-template-columns:minmax(210px,2fr) 2fr .9fr .9fr .8fr 1.6fr 18px;grid-template-areas:none;column-gap:16px}
.desk .phead{display:grid;padding:12px 18px;font-size:12.5px;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line);background:#FAFBFC}
.desk .phead .r{text-align:right}
.desk .prow{padding:12px 18px}
.desk .prow>*{grid-area:auto}
.desk .c-cat{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.desk .c-yr{display:block;text-align:right;color:var(--ink-2);font-size:14px}
.desk .c-next{padding-left:0;font-size:14px;color:var(--ink-2)}
.desk .c-st{justify-self:start}
.desk .c-go{display:block;color:var(--ink-3)}
.desk .cal{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.desk .cal-main,.desk .cal-side{padding:20px 22px}
.desk .cd{min-height:96px;align-items:flex-start;padding:8px}
.desk .cd .dl{justify-content:flex-start;margin-top:4px;gap:3px}
.desk .cd .ds{margin-top:auto;font-size:12px}

/* detalje og undersider */
.desk .det{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.desk .det-side{position:sticky;top:0}
.desk .narrow{max-width:760px;width:100%}
.desk .v-profile .narrow,.desk .v-notifs .narrow{max-width:760px}

/* indsigter som dashboard */
.desk .ins{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.desk .ins>*{grid-column:span 6}
.desk .basis{grid-column:1/-1}
.desk .ins-hist{grid-column:1/span 8}.desk .ins-goal{grid-column:9/-1}
.desk .ins-sav{grid-column:1/span 6}.desk .ins-cat{grid-column:7/-1}
.desk .ins-hour{grid-column:1/span 7}.desk .ins-rec{grid-column:8/-1}
.desk .ins-inc{grid-column:1/span 6}.desk .ins-ov{grid-column:7/-1}
.desk .hb{grid-template-columns:28px 160px 1fr 80px}

/* onboarding i netbank: delt skærm */
.desk .ob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.desk .ob-art{display:flex;background:var(--pri);color:#fff;padding:56px;align-items:center}
.desk .art-in{max-width:460px}
.desk .ob-body{max-width:560px;width:100%;margin:0 auto;padding:30px 20px 10px;height:100vh}
.desk .ob-main{justify-content:center}
.desk .feat{margin-top:6px}
.desk .note{margin-top:0}
.desk .toast{bottom:32px}

.desk .catrow{grid-template-columns:12px 1fr auto auto auto}
.desk .c-cat .ct{overflow:hidden;text-overflow:ellipsis}
.side-f .segc{margin-bottom:8px}
.desk .modes{left:20px;right:auto}
.desk .ins{grid-auto-flow:row dense}
.desk .ins-hist{grid-column:1/span 8}.desk .ins-goal{grid-column:9/-1}

.desk .sheet-bg{align-items:center}
.desk .sheet{max-width:560px;border-radius:16px;max-height:88vh}
.desk .sheet-grab{display:none}
.desk .sheet-h{padding:16px 16px 16px 22px}
.desk .sheet-b{padding:20px 22px 24px}

.desk .ov .catrow .cs{display:none}
.desk .ov .catrow{grid-template-columns:12px 1fr auto auto}
.desk .pay-top .segc:first-child{max-width:300px}
.desk .ostrip{margin:0 18px 12px 70px}
.desk .orows{grid-template-columns:1fr 1fr}
.desk .orows div:nth-child(2){border-top:0}
.desk .orows div:nth-child(even){border-left:1px solid var(--line-2)}

/* ===== Hjælpere ===== */
const ym = d => d.getFullYear()*12 + d.getMonth();
const ymKey = k => { const [y,m]=k.split('-').map(Number); return y*12+(m-1); };
const NOW_YM = ym(TODAY);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const kr = n => fmt(n)+' kr.';
const fmtDec = n => (Math.round(n*10)/10).toString().replace('.',',');
function priceAt(p, monthIdx){
  let v = 0; for(const [from,pr] of p.prices){ if(ymKey(from)<=monthIdx) v = pr; } return v;
}
const price = p => priceAt(p, NOW_YM);
const dayIn = (y,m,d) => Math.min(d, new Date(y,m+1,0).getDate());
function nextDate(p){
  let y=TODAY.getFullYear(), m=TODAY.getMonth();
  let dt = new Date(y,m,dayIn(y,m,p.day));
  if(dt<new Date(y,m,TODAY.getDate())){ m++; if(m>11){m=0;y++;} dt=new Date(y,m,dayIn(y,m,p.day)); }
  return dt;
}
const ld = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const dFmt = d => d.getDate()+'. '+MON_S[d.getMonth()];
const dLong = d => d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear();
const daysTo = d => Math.round((d - new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()))/864e5);
const slug = s => s;
function lastCharges(p, n){
  const out=[]; let y=TODAY.getFullYear(), m=TODAY.getMonth();
  for(let k=0;k<12 && out.length<n;k++){
    const d = new Date(y,m,dayIn(y,m,p.day));
    const idx = y*12+m;
    if(d<=TODAY && idx>=ymKey(p.start) && !(p.trial && idx<=ymKey(p.trial.ends.slice(0,7)) )){ out.push({d, a:priceAt(p,idx)}); }
    m--; if(m<0){m=11;y--;}
  }
  return out;
}
function priceChanges(p){
  const ch=[]; for(let i=1;i<p.prices.length;i++){ ch.push({from:p.prices[i][0], old:p.prices[i-1][1], now:p.prices[i][1]}); } return ch;
}
const monthLabel = k => { const [y,m]=k.split('-').map(Number); return MONTHS[m-1]+' '+y; };

/* ===== Afledte tal – alt regnes ud fra PAY, så summer altid stemmer ===== */
const A = {
  list:(t)=> PAY.filter(p=>t==='all'||p.type===t),
  monthly:(t)=> A.list(t).reduce((s,p)=>s+price(p),0),
  yearly:(t)=> A.monthly(t)*12,
  byCat:(t)=>{
    const o={}; A.list(t).forEach(p=>{ o[p.cat]=(o[p.cat]||0)+price(p); });
    return Object.entries(o).filter(([k,v])=>v>0||true).map(([k,v])=>({k,m:v,y:v*12,...CATS[k]})).sort((a,b)=>b.m-a.m);
  },
  firstIdx:()=>Math.min(...PAY.map(p=>ymKey(p.start)),...ENDED.map(e=>ymKey(e.start))),
  /* n = antal måneder (eller 'all'). Viser kun måneder, hvor der findes historik – aldrig 0 kr. for manglende data */
  history:(n)=>{
    const out=[]; const first=A.firstIdx(); const len=n==='all'?NOW_YM-first+1:Math.min(n||12,NOW_YM-first+1);
    for(let i=len-1;i>=0;i--){
      const idx=NOW_YM-i; let tot=0;
      PAY.filter(p=>p.type==='sub').forEach(p=>{ if(idx>=ymKey(p.start) && !(p.trial&&idx<=ymKey(p.trial.ends.slice(0,7)))) tot+=priceAt(p,idx); });
      ENDED.forEach(e=>{ if(idx>=ymKey(e.start)&&idx<=ymKey(e.end)) tot+=e.m; });
      out.push({idx,y:Math.floor(idx/12),m:idx%12,v:tot});
    }
    return out;
  },
  realised:()=>{
    const items=[];
    ENDED.forEach(e=>{ const mo=NOW_YM-ymKey(e.end); items.push({...e,months:mo,total:mo*e.m,run:e.m*12}); });
    DISCOUNTS.forEach(d=>{ const mo=NOW_YM-ymKey(d.from)+1; items.push({...d,how:'Rabat',months:mo,total:mo*d.m,run:d.m*12}); });
    return {items,total:items.reduce((s,i)=>s+i.total,0),run:items.reduce((s,i)=>s+i.run,0)};
  },
  increases:()=>{
    const out=[];
    PAY.forEach(p=>priceChanges(p).forEach(c=>{ if(ymKey(c.from)>NOW_YM-12&&c.now>c.old) out.push({p,from:c.from,old:c.old,now:c.now,diff:c.now-c.old}); }));
    return out.sort((a,b)=>ymKey(b.from)-ymKey(a.from));
  },
  perHour:()=>PAY.filter(p=>p.type==='sub'&&p.use&&price(p)>0).map(p=>({p,v:price(p)/p.use.h})).sort((a,b)=>a.v-b.v),
  overlap:()=>[
    {cat:'streaming',ids:['netflix','viaplay','appletv'],txt:'Tre streamingtjenester med overlappende film- og serieudbud.'},
    {cat:'musik',ids:['spotify','ytmusic'],txt:'To musiktjenester med næsten samme funktion.'}
  ]
};

/* ===== Logoer: Simple Icons (CC0). Tile med originalt logo i brandfarve; neutral kategoriikon-tile hvis intet logo findes ===== */
function logo(p, size){
  size = size||40;
  const cat = CATS[p.cat]||{c:'#7C8EA3',i:'package'};
  const lg = p.logo && LOGOS[p.logo];
  if(lg){
    return '<span class="lg" style="--s:'+size+'px" title="'+p.name+'"><svg viewBox="0 0 24 24" fill="'+LOGO_HEX[p.logo]+'" role="img" aria-label="'+p.name+'-logo">'+lg+'</svg></span>';
  }
  return '<span class="lg lg-n" style="--s:'+size+'px;--c:'+cat.c+'" title="'+p.name+'">'+ic(cat.i, Math.round(size*0.5))+'</span>';
}
function logoEnded(e,size){ return logo({logo:e.logo,name:e.name,cat:'oevrigsub'},size); }

/* ===== Små diagram-byggere (SVG/HTML) ===== */
function donut(segs, o){
  o=o||{}; const S=o.size||200, T=o.thick||26, R=(S-T)/2, C=2*Math.PI*R, cx=S/2;
  const tot=segs.reduce((s,x)=>s+x.m,0)||1; let acc=0, gap=segs.length>1?2.5:0;
  let rings='';
  segs.forEach(x=>{
    const len=x.m/tot*C, dash=Math.max(len-gap,0.5);
    rings+='<circle class="seg'+(o.active&&o.active!==x.k?' dim':'')+'" cx="'+cx+'" cy="'+cx+'" r="'+R+'" fill="none" stroke="'+x.c+'" stroke-width="'+T+'" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 '+cx+' '+cx+')" data-act="cat" data-key="'+x.k+'" data-tip="'+x.n+' · '+kr(x.m)+'/md. ('+Math.round(x.m/tot*100)+' %)"/>';
    acc+=len;
  });
  return '<div class="donut" style="width:'+S+'px;height:'+S+'px"><svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'" role="img" aria-label="Fordeling af udgifter på kategorier">'+

function lineChart(data, o){
  /* o: w,h, goal (valgfri mållinje), events, sel (valgt indeks), act (data-act for klik på punkt) */
  const W=o.w, H=o.h, pl=44, pr=16, pt=18, pb=o.twoLine?38:26, n=data.length;
  const vals=data.map(d=>d.v).concat(o.goal?[o.goal]:[]);
  const rawLo=Math.min(...vals), rawHi=Math.max(...vals), span=Math.max(rawHi-rawLo,200);
  const step=[50,100,200,250,500].find(s=>span/s<=5)||500;
  let lo=Math.max(0,Math.floor((rawLo-step*0.4)/step)*step), hi=Math.ceil((rawHi+step*0.4)/step)*step;
  const x=i=>n===1?(pl+W-pr)/2:pl+(W-pl-pr)*i/(n-1), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=lo; v<=hi+0.1; v+=step){ g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="grid"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" class="ax" text-anchor="end">'+fmt(v)+'</text>'; }
  let d=''; data.forEach((p,i)=>{ d+=(i?'L':'M')+x(i)+' '+y(p.v); });
  const area=d+' L'+x(n-1)+' '+y(lo)+' L'+x(0)+' '+y(lo)+'Z';
  /* x-akse: månedsnavn; årstal på første etiket og ved januar (to linjer ved lange perioder) */
  const every=o.every||(n<=7?1:n<=13?2:n<=25?3:6);
  /* vælg etiketter og fjern dem, der ville støde sammen */
  let ticks=[];
  data.forEach((p,i)=>{ if(n<=13 ? (i%every===0||i===n-1) : (p.m%every===0||i===0||i===n-1)) ticks.push(i); });
  const gap=o.twoLine?40:32, kept=[];
  ticks.forEach(i=>{ while(kept.length && x(i)-x(kept[kept.length-1])<gap){ if(i===n-1&&kept.length>1) kept.pop(); else return; } kept.push(i); });
  let xl='';
  kept.forEach((i,k)=>{ const p=data[i];
    const prevYear=k>0?data[kept[k-1]].y:null, yr=(k===0||p.y!==prevYear);
    const anchor=i===0?'start':i===n-1?'end':'middle';
    if(o.twoLine) xl+='<text x="'+x(i)+'" y="'+(H-20)+'" class="ax" text-anchor="'+anchor+'">'+MON_S[p.m].replace('.','')+'</text>'+(yr?'<text x="'+x(i)+'" y="'+(H-6)+'" class="ax yr" text-anchor="'+anchor+'">'+p.y+'</text>':'');
    else xl+='<text x="'+x(i)+'" y="'+(H-6)+'" class="ax" text-anchor="'+anchor+'">'+MON_S[p.m].replace('.','')+(yr&&k===0?' '+String(p.y).slice(2):(yr&&p.m===0?' '+String(p.y).slice(2):''))+'</text>';
  });
  const goal=o.goal?'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(o.goal)+'" y2="'+y(o.goal)+'" class="goal"/><text x="'+(W-pr)+'" y="'+(y(o.goal)-6)+'" class="goal-t" text-anchor="end">Mål '+fmt(o.goal)+' kr.</text>':'';
  const sel=(o.sel!=null&&o.sel<n)?o.sel:n-1;
  let hits='', pts='';
  const dense=n>25;
  data.forEach((p,i)=>{
    const on=i===sel;
    if(!dense||on||i===n-1) pts+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(on?5:3)+'" class="pt'+(on?' pt-l':'')+'"/>';
    const w=n>1?(W-pl-pr)/(n-1):W;
    hits+='<rect x="'+(x(i)-w/2)+'" y="'+pt+'" width="'+w+'" height="'+(H-pt-pb)+'" fill="transparent" class="hit"'+
      (o.act?' data-act="'+o.act+'" data-v="'+i+'" tabindex="0" role="button" aria-label="'+MONTHS[p.m]+' '+p.y+': '+kr(p.v)+'"':'')+
      ' data-tip="'+MONTHS[p.m]+' '+p.y+' · '+kr(p.v)+'"/>';
  });
  const guide='<line x1="'+x(sel)+'" x2="'+x(sel)+'" y1="'+pt+'" y2="'+(H-pb)+'" class="selg"/>';
  let ev='';
  (o.events||[]).forEach(e=>{ const i=data.findIndex(p=>p.idx===e.idx); if(i<0) return;
    ev+='<g class="ev"><line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+(y(data[i].v)+7)+'" y2="'+(H-pb)+'" class="evl"/><circle cx="'+x(i)+'" cy="'+y(data[i].v)+'" r="6" class="evc '+e.k+'"/></g>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Udvikling i månedlige abonnementsudgifter">'+g+goal+'<path d="'+area+'" class="area"/>'+(o.act?guide:'')+'<path d="'+d+'" class="ln"/>'+ev+pts+xl+hits+'</svg>';
}

/* Kalender */
function occurrences(y,m){
  const out=[]; const idx=y*12+m;
  PAY.forEach(p=>{
    if(idx<ymKey(p.start)) return; if(S.type!=='all'&&p.type!==S.type) return;
    const d=new Date(y,m,dayIn(y,m,p.day));
    if(p.trial && d<ld(p.trial.ends)) return;
    if(S.marked[p.id] && d>=nextDate(p)) return;
    let a=p.trial?p.after:(idx>NOW_YM?price(p):priceAt(p,idx));
    if(p.id==='viaplay'&&S.offerTaken){ const n=nextDate(p); if(d>=n&&d<addM(n,OFFERS.viaplay.months)) a=OFFERS.viaplay.price; }
    if(S.switched&&S.switched[p.id]&&d>=nextDate(p)) a=OFFERS[p.id].price;
    out.push({p,d,a,paid:d<new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()),trialEnd:!!p.trial&&d.getTime()===ld(p.trial.ends).getTime()});
  });
  return out;
}
function calendar(){

  const byDay={}; occ.forEach(o=>{(byDay[o.d.getDate()]=byDay[o.d.getDate()]||[]).push(o);});

  }
  const selD=S.cal.sel||null, selO=selD?(byDay[selD]||[]):[];

  return '<div class="cal"><div class="cal-main"><div class="calh"><button class="iconbtn sm" data-act="calnav" data-v="-1" aria-label="Forrige måned">'+ic('chevL',20)+'</button><h2>'+MONTHS[m]+' '+y+'</h2><button class="iconbtn sm" data-act="calnav" data-v="1" aria-label="Næste måned">'+ic('chevR',20)+'</button></div>'+

/* ===== Besparelsesmuligheder pr. abonnement (EKSEMPELDATA – ikke rigtige tilbud) =====
   kind: 'tilbud'   = midlertidig pris i en periode, derefter normal pris
         'skift'    = skift til en anden, billigere plan (løbende)
         'opsigelse'= besparelsen kræver, at abonnementet opsiges
   Abonnementer uden et relevant tilbud har intet offer – der vises ikke et opdigtet tilbud. */
const OFFERS = {
  viaplay:{kind:'tilbud',title:'Fastholdelsestilbud fra Viaplay',price:99,months:3,binding:'Ingen binding',
    why:'Sendt via '+USER.bank+', fordi der er registreret begrænset brug.',cta:'Se tilbud'},
  spotify:{kind:'skift',title:'Skift til Spotify Premium Student',plan:'Premium Student',price:59,binding:'Ingen binding',

    url:'https://www.spotify.com/dk/student/',steps:['Gå til Spotifys side for Premium Student','Log ind og bekræft din studiestatus','Vælg Premium Student – dit nuværende Premium stopper automatisk']},
  ytmusic:{kind:'opsigelse',title:'Opsig YouTube Music',binding:'Ingen binding',why:'Overlapper med Spotify, som du bruger mest (38 mod 4 timer).',cta:'Se opsigelse'},
  adobe:{kind:'opsigelse',title:'Opsig Adobe Creative Cloud',binding:'Årsplan betalt månedligt kan have opsigelsesgebyr',why:'Der er registreret begrænset brug på den tilsluttede computer.',cta:'Se opsigelse'},
  appletv:{kind:'opsigelse',title:'Opsig før prøveperioden udløber',binding:'Ingen binding',why:'Opsiger du senest 21. nov., trækkes der ingen betaling.',cta:'Se opsigelse'}
};
const KIND = {tilbud:{l:'Midlertidigt tilbud',ic:'gift'},skift:{l:'Kræver skift af abonnement',ic:'swap'},opsigelse:{l:'Kræver opsigelse',ic:'stop'}};
S.switched = S.switched||{};
const nowPrice = p => p.trial ? 0 : price(p);
const addM = (d,n) => new Date(d.getFullYear(), d.getMonth()+n, dayIn(d.getFullYear(), d.getMonth()+n, d.getDate()));
/* Hvad sker der lige nu med tilbuddet? null = ingen mulighed at vise */
function offerOf(p){
  const o = OFFERS[p.id]; if(!o) return null;
  if(S.dismissed[p.id]) return null;
  if(o.kind==='opsigelse' && S.marked[p.id]) return {o, done:'Markeret til opsigelse – stopper '+dFmt(nextDate(p))};
  if(o.kind==='tilbud' && S.offerTaken){ const n=nextDate(p), last=addM(n,o.months-1), full=addM(n,o.months);
    return {o, done:'Tilbud aktivt: '+o.price+' kr./md. ved de næste '+o.months+' betalinger ('+dFmt(n)+' – '+dFmt(last)+'). Derefter '+price(p)+' kr./md. fra '+dFmt(full)}; }
  if(o.kind==='skift' && S.switched[p.id]) return {o, done:'Skift markeret – '+o.price+' kr./md. fra næste betaling '+dFmt(nextDate(p))};
  return {o};
}
/* Besparelse – altid i samme tidsperiode som prisen. Midlertidige tilbud vises kun for tilbudsperioden. */
function saving(p,o){
  const now = nowPrice(p);
  if(o.kind==='tilbud'){ const d=now-o.price; return {head:'Spar '+kr(d*o.months)+' i tilbudsperioden', big:kr(d*o.months), sub:'i tilbudsperioden ('+o.months+' måneder × '+d+' kr.)'}; }
  if(o.kind==='skift'){ const d=now-o.price; return {head:'Spar '+d+' kr./md.', big:d+' kr./md.', sub:'svarer til '+kr(d*12)+' pr. år, så længe du har planen'}; }
  const m = p.trial ? p.after : now;
  return {head:(p.trial?'Undgå ':'Spar ')+m+' kr./md.', big:m+' kr./md.', sub:p.trial?'hvis du opsiger før '+dFmt(ld(p.trial.ends))+' – svarer til '+kr(m*12)+' pr. år':'svarer til '+kr(m*12)+' pr. år, når abonnementet er stoppet'};
}
function offerLine(p,o){
  if(o.kind==='tilbud') return 'Tilbud: '+o.price+' kr./md. i '+o.months+' mdr. · derefter '+price(p)+' kr./md.';
  if(o.kind==='skift') return o.plan+': '+o.price+' kr./md. i stedet for '+price(p)+' kr./md.';
  return p.trial?'Kræver opsigelse senest '+dFmt(new Date(ld(p.trial.ends).getTime()-864e5)):KIND.opsigelse.l+(o.kind==='opsigelse'&&p.id==='ytmusic'?' · overlapper med Spotify':' · begrænset registreret brug');
}
function ctaBtn(p,o,cls){
  return o.kind==='opsigelse'
    ? '<button class="'+cls+' red" data-act="opsig" data-id="'+p.id+'">'+o.cta+'</button>'
    : '<button class="'+cls+' primary" data-act="osheet" data-id="'+p.id+'">'+o.cta+'</button>';
}
/* Kompakt linje under abonnementet i listen */
function offerStrip(p){
  const r=offerOf(p); if(!r) return '';
  const o=r.o;
  if(r.done) return '<div class="ostrip done">'+ic('check',16)+'<span class="os-t"><small>'+r.done+'</small></span></div>';
  const s=saving(p,o);
  return '<div class="ostrip k-'+o.kind+'"><span class="os-ic">'+ic(KIND[o.kind].ic,16)+'</span><span class="os-t"><b>'+s.head+'</b><small>'+offerLine(p,o)+'</small></span>'+ctaBtn(p,o,'os-btn')+'</div>';

/* Kort på abonnementets egen side */
function offerCard(p,named){
  const H=named?'<div class="oname">'+logo(p,32)+'<b>'+p.name+'</b></div>':'<h2>Mulighed for at spare</h2>';
  const r=offerOf(p);
  if(!r){
    const o=OFFERS[p.id];
    return '<section class="card ocard none"><div class="cardh"><h2>Mulighed for at spare</h2></div><p class="body soft0">'+(o&&S.dismissed[p.id]?'Du har valgt at beholde '+p.name+'.':'Der er ingen relevante tilbud eller billigere alternativer til '+p.name+' lige nu. Vi viser kun tilbud, når der findes et.')+'</p></section>';
  }
  const o=r.o, now=nowPrice(p), s=saving(p,o);
  const rows=[['Du betaler nu', p.trial?'0 kr. · prøveperiode til '+dFmt(ld(p.trial.ends)):now+' kr./md.']];
  if(o.kind==='tilbud'){ rows.push(['Tilbud',o.price+' kr./md. i '+o.months+' måneder']); rows.push(['Derefter',price(p)+' kr./md.']); }
  if(o.kind==='skift'){ rows.push([o.plan,o.price+' kr./md.']); rows.push(['Varighed',o.dur]); }
  if(o.kind==='opsigelse'){ rows.push([p.trial?'Derefter':'Efter opsigelse',p.trial?p.after+' kr./md., hvis du ikke opsiger':'0 kr./md.']); }
  rows.push(['Binding',o.binding]);
  return '<section class="card ocard k-'+o.kind+'"><div class="cardh">'+H+chip('Eksempeldata','plain')+'</div>'+
    '<div class="okind">'+ic(KIND[o.kind].ic,16)+KIND[o.kind].l+'</div>'+
    '<div class="orows">'+rows.map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div>'+
    (r.done?'<p class="body ok">'+ic('check',16)+' '+r.done+'</p>'+(named?go('detail',p.id,'Se abonnement '+ic('chevR',14),'link'):''):
    '<div class="osave"><small>Din besparelse</small><b>'+s.big+'</b><span>'+s.sub+'</span></div>'+
    '<p class="body soft0">'+o.why+'</p>'+ctaBtn(p,o,'btn wide'))+'</section>';
}

function nav(v,params){ if(v===S.view&&JSON.stringify(params||{})===JSON.stringify(S.params)) return; S.hist.push({view:S.view,params:S.params}); S.view=v; S.params=params||{}; render(); }

document.addEventListener('click',e=>{

    case 'cat': case 'catgo': { const k=el.dataset.key; S.cat=k; S.type=CATS[k].t===S.type||S.type==='all'?S.type:CATS[k].t; S.tab='list'; S.hist=[]; S.view='payments'; render(); break; }
    case 'allcats': S.showAll=true; render(true); break;
    case 'showatt': S.showAtt=true; render(true); break;
    case 'calnav': { let m=S.cal.m+Number(v), y=S.cal.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} S.cal={y,m,sel:null}; render(true); break; }
    case 'calsel': S.cal.sel=Number(v)||null; render(true); break;

    case 'acc': S.perms.acc=S.perms.acc||{}; S.perms.acc[v]=S.perms.acc[v]===false; render(true); break;
    case 'mark': S.marked[id]={}; S.sheet=null; S.hist=S.hist.filter(h=>h.view!=='cancel'); S.hist.push({view:S.view,params:S.params}); S.view='success'; S.params={id}; render(); break;
    case 'unmark': delete S.marked[id]; S.sheet=null; toast('Markeringen er fjernet'); break;
    case 'keep': S.dismissed[id]=true; toast('Fjernet fra potentielle besparelser'); break;
    case 'dismiss': { S.dismissed[id]=true; const h=S.hist.pop(); if(h){S.view=h.view;S.params=h.params;} else {S.view='detail';S.params={id};} } S.toast=el.dataset.why==='other'?'Tak – vurderingen er rettet':'Fjernet fra potentielle besparelser'; render(); setTimeout(()=>{S.toast=null;render(true);},2200); break;
    case 'takeoffer': S.offerTaken=true; S.osheet=null; toast('Tilbuddet er accepteret'); break;
    case 'hper': S.hper=(v==='all'?'all':Number(v)); S.hsel=null; render(true); break;
    case 'hsel': S.hsel=Number(v); render(true); { const f=document.querySelector('.hit[data-v="'+v+'"]'); } break;
    case 'goal': S.goal=Math.max(300,S.goal+Number(v)); render(true); break;
    case 'inscat': S.insCat=v; render(true); break;
    case 'nf': S.nf=v; render(true); break;
    case 'faq': S.faq=S.faq===Number(v)?null:Number(v); render(true); break;
    case 'toast': toast(v); break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target; if(el.tagName!=='INPUT'||!el.dataset.act) return;
  const a=el.dataset.act, k=el.dataset.k;
  if(a==='tgl') S.notif[k]=el.checked;
  if(a==='remind') S.remind.appletv=el.checked;
  if(a==='perm') S.perms[k]=el.checked;
  if(a==='usage') S.usageChoice=el.checked?'on':'off';
  if(a==='acct'){ S.perms.acc=S.perms.acc||{}; S.perms.acc[k]=el.checked; }
  render(true);
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('hit')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; } if(e.key==='Escape'&&(S.sheet||S.osheet)){ S.sheet=null; S.osheet=null; render(true);} });
let lastDesk=null; addEventListener('resize',()=>{ const d=innerWidth>=1000; if(d!==lastDesk){ lastDesk=d; render(true);} else layout(); });
lastDesk=innerWidth>=1000;
(function init(){ const [h,id,tb]=location.hash.slice(1).split(':'); if(h&&V[h]){ S.view=h; if(id) S.params={id}; if(tb) S.tab=tb; if(h==='scan') S.scanStep=99; if(tb==='sheet'){S.tab='list';S.sheet=id;} if(tb==='offer'){S.osheet=id;} } render(); })();
</script></body></html>
